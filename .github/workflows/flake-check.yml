---
# Lines inside the `extra-conf:` block include cache signing public keys,
# which push them past the default 100-char limit.
# yamllint disable rule:line-length
name: Flake Check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: flake-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            trusted-users = root runner
            access-tokens = github.com=${{ secrets.KRYPTONIX_ACCESS_TOKEN }}
            extra-substituters = s3://thoughtfull-nix-cache?region=us-east-1 https://cache.numtide.com https://devenv.cachix.org
            extra-trusted-public-keys = nix-cache.thoughtfull.systems-1:kN4M+h0QLcDpQksBsFNtE9t6+bLa/s4axEWYpDmz2ag= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=
      - name: Configure Nix daemon AWS credentials
        uses: ./.github/actions/configure-nix-daemon-aws-creds
        with:
          # Only `push` runs (to main) get write access, so a pull_request build can
          # never poison the cache; PRs stay read-only and benefit from what main
          # last pushed.
          role-to-assume: >-
            arn:aws:iam::481411455398:role/NixCache${{
            github.event_name == 'push' && 'Writer' || 'Reader' }}
      - name: Run devenv test
        run: nix develop --no-pure-eval --command devenv test
      - name: Run flake check
        run: nix flake check --no-pure-eval
      - name: Push check outputs to cache
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "${{ secrets.CACHE_SIGNING_KEY }}" >/tmp/sign.key
          trap 'shred -u /tmp/sign.key' EXIT
          readarray -t names < <(
            nix eval --no-pure-eval --json .#checks.x86_64-linux \
              --apply builtins.attrNames | jq -r '.[]'
          )
          installables=("${names[@]/#/.#checks.x86_64-linux.}")
          nix copy --to \
            "s3://thoughtfull-nix-cache?region=us-east-1&secret-key=/tmp/sign.key" \
            "${installables[@]}"
      - name: Remove AWS credential files
        if: always()
        uses: ./.github/actions/cleanup-nix-daemon-aws-creds
