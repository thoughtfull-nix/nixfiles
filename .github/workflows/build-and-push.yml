---
# Lines inside the `extra-conf:` block include cache signing public keys,
# which push them past the default 100-char limit.
# yamllint disable rule:line-length
name: Build and Push
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *" # daily 02:00 UTC, ~1 hr before client pulls
  workflow_dispatch:
concurrency:
  group: build-and-push
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Hosts of the same architecture build together on one runner so they
          # share a single local /nix/store; the large common closure is realised
          # once instead of once per host. Different architectures still run in
          # parallel on their own runners.
          - runner: ubuntu-24.04
            hosts: aegle hydor sedna
          - runner: ubuntu-24.04-arm
            hosts: tislit
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Free disk space
        # jlumbroso/free-disk-space targets the x64 hosted runner image; the
        # arm runner has a different (smaller) preinstalled toolset and
        # plenty of headroom already, so skip it there.
        if: matrix.runner == 'ubuntu-24.04'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          swap-storage: false
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            trusted-users = root runner
            access-tokens = github.com=${{ secrets.KRYPTONIX_ACCESS_TOKEN }}
            experimental-features = nix-command flakes
            extra-substituters = s3://thoughtfull-nix-cache?region=us-east-1&priority=50 https://cache.numtide.com https://devenv.cachix.org
            extra-trusted-public-keys = nix-cache.thoughtfull.systems-1:kN4M+h0QLcDpQksBsFNtE9t6+bLa/s4axEWYpDmz2ag= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=
      - name: Configure Nix daemon AWS credentials
        if: matrix.runner != 'ubuntu-24.04-arm'
        uses: ./.github/actions/configure-nix-daemon-aws-creds
        with:
          role-to-assume: arn:aws:iam::481411455398:role/NixCacheWriter
          role-duration-seconds: 7200
      - name: Configure Nix daemon AWS credentials (arm)
        # The arm runner is slower, so give its assumed role's credentials
        # longer to live than the default before they expire mid-build.
        if: matrix.runner == 'ubuntu-24.04-arm'
        uses: ./.github/actions/configure-nix-daemon-aws-creds
        with:
          role-to-assume: arn:aws:iam::481411455398:role/NixCacheWriter
          role-duration-seconds: 7200
      - name: Build system closures
        run: |
          set -euo pipefail
          read -ra hosts <<<"${{ matrix.hosts }}"
          installables=()
          for host in "${hosts[@]}"; do
            installables+=(".#nixosConfigurations.$host.config.system.build.toplevel")
          done
          # One build invocation for all hosts of this architecture: Nix realises
          # each shared derivation once and parallelises the independent parts.
          for attempt in 1 2 3; do
            if nix build --no-link \
              "${installables[@]}"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep "$((attempt * 15))"
          done
      - name: Sign, push, and publish closures
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "${{ secrets.CACHE_SIGNING_KEY }}" >/tmp/sign.key
          trap 'shred -u /tmp/sign.key' EXIT
          read -ra hosts <<<"${{ matrix.hosts }}"
          for host in "${hosts[@]}"; do
            # Resolve the host's toplevel; the build step already realised it, so
            # this only evaluates and returns the store path.
            out=$(nix build --no-link --print-out-paths \
              ".#nixosConfigurations.$host.config.system.build.toplevel")
            nix copy --to \
              "s3://thoughtfull-nix-cache?region=us-east-1&secret-key=/tmp/sign.key" \
              "$out"
            jq -n \
              --arg p "$out" \
              --arg r "${{ github.sha }}" \
              --arg t "$(date -u +%FT%TZ)" \
              '{storePath:$p, gitRev:$r, builtAt:$t}' \
              >latest.json
            aws s3 cp latest.json \
              "s3://thoughtfull-nix-cache/hosts/$host/latest.json" \
              --cache-control "no-cache"
          done
      - name: Remove AWS credential files
        if: always()
        uses: ./.github/actions/cleanup-nix-daemon-aws-creds
