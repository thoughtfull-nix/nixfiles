---
# Lines inside the `extra-conf:` block include cache signing public keys,
# which push them past the default 100-char limit.
# yamllint disable rule:line-length
name: Build and Push
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * *" # daily 02:00 UTC, ~1 hr before client pulls
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: aegle
            runner: ubuntu-24.04
          - host: hydor
            runner: ubuntu-24.04
          - host: sedna
            runner: ubuntu-24.04
          - host: tislit
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          swap-storage: false
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            trusted-users = root runner
            access-tokens = github.com=${{ secrets.KRYPTONIX_ACCESS_TOKEN }}
            experimental-features = nix-command flakes
            extra-substituters = s3://thoughtfull-nix-cache?region=us-east-1 https://cache.numtide.com https://devenv.cachix.org
            extra-trusted-public-keys = nix-cache.thoughtfull.systems-1:kN4M+h0QLcDpQksBsFNtE9t6+bLa/s4axEWYpDmz2ag= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw=
      - name: Configure Nix daemon AWS credentials
        uses: ./.github/actions/configure-nix-daemon-aws-creds
        with:
          role-to-assume: arn:aws:iam::481411455398:role/NixCacheWriter
      - name: Build system closure
        id: build
        run: |
          for attempt in 1 2 3; do
            if out=$(nix build --no-link --print-out-paths \
              --override-input nixpkgs github:NixOS/nixpkgs/nixos-26.05 \
              ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel"); then
              echo "out=$out" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep "$((attempt * 15))"
          done
      - name: Refresh Nix daemon AWS credentials
        # The default 1-hour STS session can expire during a long aarch64 build; refresh before
        # uploading. The x86_64 legs build well within that window, so skip the extra assume-role
        # round trip and daemon restart for them.
        if: matrix.runner == 'ubuntu-24.04-arm'
        uses: ./.github/actions/configure-nix-daemon-aws-creds
        with:
          role-to-assume: arn:aws:iam::481411455398:role/NixCacheWriter
      - name: Sign and push closure to S3
        run: |
          umask 077
          printf '%s\n' "${{ secrets.CACHE_SIGNING_KEY }}" >/tmp/sign.key
          nix copy --to \
            "s3://thoughtfull-nix-cache?region=us-east-1&secret-key=/tmp/sign.key" \
            "${{ steps.build.outputs.out }}"
          shred -u /tmp/sign.key
      - name: Publish pointer
        run: |
          jq -n \
            --arg p "${{ steps.build.outputs.out }}" \
            --arg r "${{ github.sha }}" \
            --arg t "$(date -u +%FT%TZ)" \
            '{storePath:$p, gitRev:$r, builtAt:$t}' \
            >latest.json
          aws s3 cp latest.json \
            "s3://thoughtfull-nix-cache/hosts/${{ matrix.host }}/latest.json" \
            --cache-control "no-cache"
      - name: Remove AWS credential files
        if: always()
        uses: ./.github/actions/cleanup-nix-daemon-aws-creds
